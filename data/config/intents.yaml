# Fine-grained reasons patients call. Each intent maps to one category (categories.yaml);
# regrouping after nurse feedback means editing `category` here and retraining.
# Source of truth: "Intent list (draft)" in the project plan doc. Not validated with a nurse.
#
# urgency: what the generator asks the text to express (the ground-truth label of a request)
#   critical | soon | routine
#   soon_plus        -> soon, sometimes critical (severe wording)
#   routine_assisted -> routine, but soon when the patient cannot walk alone (labeling rule 6)
# weight: relative frequency. ASSUMPTION, shaped by the ranking in Tzeng 2010
#   (bathroom help > pain medication > IV/pump problems > personal help > repositioning).
# requires: patient attributes the intent needs (has_iv, bedbound, not_bedbound).

intents:
  # Breathing
  - {id: cannot_breathe, category: breathing, urgency: critical, weight: 0.2, example: "Nefes alamıyorum"}
  - {id: choking, category: breathing, urgency: critical, weight: 0.1, example: "Bir şey kaçtı, boğuluyor"}
  - {id: short_of_breath, category: breathing, urgency: soon_plus, weight: 1.0, example: "Nefesim daralıyor"}
  - {id: oxygen_not_reaching, category: breathing, urgency: soon_plus, weight: 0.8, example: "Oksijen maskem düştü"}

  # Pain
  - {id: chest_pain, category: pain, urgency: critical, weight: 0.3, example: "Göğsüm sıkışıyor"}
  - {id: new_pain, category: pain, urgency: soon, weight: 3.0, example: "Karnım ağrımaya başladı"}
  - {id: worsening_pain, category: pain, urgency: soon, weight: 3.0, example: "Ağrım arttı, geçmiyor"}
  - {id: wants_painkiller, category: pain, urgency: soon, weight: 9.0, example: "Ağrı kesici alabilir miyim"}
  - {id: pain_resolved, category: pain, urgency: routine, weight: 1.0, example: "Ağrım geçti, haber vereyim dedim"}

  # Neuro and consciousness
  - {id: unresponsive, category: neuro, urgency: critical, weight: 0.1, example: "Annem uyanmıyor"}
  - {id: speech_face_change, category: neuro, urgency: critical, weight: 0.1, example: "Konuşamıyor, yüzü kaydı"}
  - {id: confusion, category: neuro, urgency: soon_plus, weight: 0.8, example: "Babam kimseyi tanımıyor"}
  - {id: dizzy_faint, category: neuro, urgency: soon_plus, weight: 1.0, example: "Başım dönüyor, bayılacak gibiyim"}

  # Fall and injury
  - {id: fell, category: fall_injury, urgency: critical, weight: 0.3, example: "Babam düştü"}
  - {id: heavy_bleeding, category: fall_injury, urgency: critical, weight: 0.1, example: "Çok kanıyor"}
  - {id: minor_bleeding, category: fall_injury, urgency: soon, weight: 0.6, example: "Kolumdan biraz kan geliyor"}
  - {id: dressing_problem, category: fall_injury, urgency: soon, weight: 1.0, example: "Pansumanım ıslandı"}

  # Physical help
  - {id: toilet_help, category: physical_help, urgency: routine_assisted, weight: 14.0, requires: [not_bedbound], example: "Tuvalete gitmem lazım"}
  - {id: bedpan_urinal, category: physical_help, urgency: soon, weight: 8.0, requires: [bedbound], example: "Sürgü lazım"}
  - {id: soiled, category: physical_help, urgency: soon, weight: 3.0, example: "Altımı ıslattım"}
  - {id: hygiene, category: physical_help, urgency: routine, weight: 3.0, example: "Yıkanmak istiyorum"}
  - {id: get_up_walk, category: physical_help, urgency: routine_assisted, weight: 4.0, requires: [not_bedbound], example: "Kalkmak istiyorum, yardım eder misiniz"}
  - {id: reposition, category: physical_help, urgency: routine, weight: 6.0, example: "Beni yan çevirir misiniz"}

  # Comfort and supplies
  - {id: water, category: comfort_supplies, urgency: routine, weight: 6.0, example: "Su alabilir miyim"}
  - {id: food, category: comfort_supplies, urgency: routine, weight: 2.0, example: "Yemeğim gelmedi"}
  - {id: blanket_temperature, category: comfort_supplies, urgency: routine, weight: 3.0, example: "Üşüyorum, battaniye lazım"}
  - {id: bed_adjust, category: comfort_supplies, urgency: routine, weight: 3.0, example: "Yatağımı dikleştirir misiniz"}
  - {id: room_environment, category: comfort_supplies, urgency: routine, weight: 2.0, example: "Işığı kapatır mısınız, çok gürültü var"}
  - {id: supplies, category: comfort_supplies, urgency: routine, weight: 2.0, example: "Peçete bitti"}

  # Medication
  - {id: next_dose_time, category: medication, urgency: routine, weight: 3.0, example: "İlacım ne zaman verilecek"}
  - {id: missed_dose, category: medication, urgency: soon, weight: 0.7, example: "Sabah ilacımı vermediler"}
  - {id: med_question, category: medication, urgency: routine, weight: 1.5, example: "Bu ilacı neden içiyorum"}
  - {id: side_effect, category: medication, urgency: soon_plus, weight: 0.7, example: "İlacı alınca kaşıntı başladı"}

  # Equipment
  - {id: pump_alarm, category: equipment, urgency: soon, weight: 6.0, requires: [has_iv], example: "Serum makinesi ötüyor"}
  - {id: iv_finished, category: equipment, urgency: soon, weight: 4.0, requires: [has_iv], example: "Serumum bitti"}
  - {id: iv_site_problem, category: equipment, urgency: soon, weight: 2.0, requires: [has_iv], example: "Serum takılan yer şişti"}
  - {id: other_device_alarm, category: equipment, urgency: soon, weight: 1.5, example: "Monitör ötüyor"}

  # Information
  - {id: doctor_rounds, category: information, urgency: routine, weight: 3.0, example: "Doktor ne zaman gelecek"}
  - {id: test_results, category: information, urgency: routine, weight: 2.0, example: "Tahlil sonuçlarım çıktı mı"}
  - {id: discharge, category: information, urgency: routine, weight: 2.0, example: "Ne zaman taburcu olacağım"}
  - {id: visiting, category: information, urgency: routine, weight: 1.0, example: "Ziyaret saati kaçta"}
  - {id: meal_times, category: information, urgency: routine, weight: 1.0, example: "Akşam yemeği kaçta"}

  # Emotional
  - {id: anxiety_fear, category: emotional, urgency: soon, weight: 1.5, example: "Çok korkuyorum"}
  - {id: wants_company, category: emotional, urgency: routine, weight: 2.0, example: "Biri yanımda olsun istiyorum"}
  - {id: cannot_sleep, category: emotional, urgency: routine, weight: 1.5, example: "Uyuyamıyorum"}
  - {id: hopelessness, category: emotional, urgency: critical, weight: 0.1, example: "Artık yaşamak istemiyorum"}

  # Unclear
  - {id: vague_distress, category: unclear, urgency: soon, weight: 2.5, example: "Kötü hissediyorum, bir şey oldu"}
