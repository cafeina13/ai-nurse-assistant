  self_harm: ["ölmek ist", "yaşamak istem", "kendimi öldür", "kendini öldür", "intihar", "atlayaca", "canıma kıy", "kendime (bir/bi) (şey/şi) yap", "yaşamanın anlamı", "bitirmek isti", "her şey bitsin"]
