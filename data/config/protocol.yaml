  head: ["baş(ım/ı/ıma/ına)", "kafa", "ense"]
  unconscious: ["göz(leri/ü) don", "öylece kal", "kendini kaybet", "kendinden geç", "uyanmı", "uyandıramı", "tepki vermi", "cevap vermi", "ses vermi", "bayıldı", "bayılıp", "kendinde değil", "bilinc(i) (git/kapan/yok/bulan)", "göz(ünü/lerini/ü/leri) açmı", "kıpırdamı", "duymuyo", "kendimi kaybed"]
  stroke: ["dil(im/i) dönmü", "dil(im/i) dolaş", "ağzı kay", "(yüz/ağz)(ü/ı/üm/ım) ... kay", "ağzı çarpıl", "konuşamı", "dili dolan", "kol(unu/umu/u/um) kaldıramı", "yarısı hissetmi", "kelime ... çıkaramı", "laf çıkmı", "konuşması bozul"]
  confusion: ["kendini kaybet", "akl(ı/ım) yerinde değil", "hatırlamı", "hatırlayamı", "kim olduğ(umu/umuzu) ... (unut/bilmi)", "yabancı bak", "neden burda", "niye burda", "hangi ara geldim", "burası nere", "kafa(m/sı) basmı", "ne dediğimi bilmi", "ne sorduğumu anlamı", "anlamıyo", "bulandı", "tanımı", "tanıyamı", "sayıkl", "şaşkın", "kafa(m/sı) karış", "karışık", "saçmal", "bulanık", "neredeyim", "nerdeyim", "burası neresi", "kim olduğ", "ajite", "kendinde değil", "anlamsız", "çıldır"]
  dizzy: ["bayılıyo", "dengesiz", "dalgın", "uykulu hal", "göz(lerim/üm) görmez", "baş(ım/ı) dön", "göz(üm/ü) karar", "sersem", "bayılacak", "bayılcam", "bayılıcam", "bayılmak üzere", "fenalaş", "halsiz"]
  fever: ["ateş", "titre", "titri", "yanıyo"]
  vomit: ["kus", "kustu", "kusma", "bulantı", "mide(m) bulan", "öğür"]
  blood: ["kan"]
  dark_vomit: ["simsiyah", "siyah", "kahve telvesi", "kahve gibi"]
  heavy_bleeding: ["kanama ... (arttı/fena/çok/durmu)", "kan ... durmu", "kan dol", "çok kan", "kan fışkır", "kan(ı) durmu", "oluk gibi", "kan içinde", "kana bulan", "kan tutmu", "kan şarıl", "kan akıyo"]
  vital_dropped: ["(ateş/tansiyon/şeker/nabz/nabız/değer/sıcaklı)(ım/i/ı/u/si/sı/ları) ... düş", "sisteme düş", "(maske/pansuman/bant/sargı/hortum/kanül/ortü/örtü)(m/si/sı/ım/i/ı) ... düş"]
  fall: ["yataktan ... düş", "düşmüş", "aşağı düş", "düştüm", "(annem/babam/eşim/dedem/ninem/oğlum/kızım/kayınvalidem/kayınpederim/hasta) ... düştü", "yere (düş/kapaklan/yuvarlan/yığıl)", "yerde kal", "yataktan (düş/kay)"]
