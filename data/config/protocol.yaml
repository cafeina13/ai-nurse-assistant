  sudden: ["birden", "aniden", "bir anda", "ansızın"]
  worsening: ["arttı", "artıyo", "artmaya", "arttıkça", "gittikçe", "giderek", "kötüleş", "geçmiyo", "daha kötü", "katlan", "şiddetlen", "hızla"]
