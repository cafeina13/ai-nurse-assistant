  mild: ["biraz", "hafif", "idare", "önemli değil", "acil değil", "ufak", "azıcık"]
  urgency_words: ["acil", "çabuk", "hemen", "yetiş", "koşun", "ne olur", "imdat"]

protocol:
  # ---------- critical: red flags first
  - {cell: emotional/critical, any: [self_harm, hopeless]}
  - {cell: neuro/critical, any: [unconscious], none: [passed]}
  - {cell: neuro/critical, any: [stroke], none: [passed]}
  - {cell: pain/critical, all: [chest, pain], none: [passed, mild]}
  - {cell: breathing/critical, any: [choke]}
  - {cell: breathing/critical, any: [breath_stopped], none: [passed]}
  - {cell: breathing/critical, all: [breath], any: [inability, alarm_sign, worsening, severe], none: [passed]}
  - {cell: breathing/critical, all: [oxygen, breath], any: [inability, alarm_sign], none: [passed]}
  - {cell: fall_injury/critical, all: [vomit], any: [blood, dark_vomit]}
  - {cell: fall_injury/critical, any: [fall], none: [vital_dropped]}
  - {cell: fall_injury/critical, any: [heavy_bleeding]}
  - {cell: other_symptom/critical, all: [fever, confusion]}
  - {cell: medication/critical, any: [swelling]}
  - {cell: pain/critical, all: [head, pain, sudden], any: [severe]}
  - {cell: neuro/critical, all: [confusion], any: [severe, sudden]}
  - {cell: neuro/critical, all: [dizzy], any: [alarm_sign]}
  # ---------- soon and routine, by category
  - {cell: breathing/routine, all: [breath, passed]}
  - {cell: breathing/routine, all: [oxygen, device_question]}
  - {cell: breathing/soon, any: [breath]}
  - {cell: breathing/soon, all: [oxygen], none: [device_question]}
  - {cell: neuro/routine, any: [dizzy, confusion], all: [passed]}
  - {cell: neuro/soon, any: [dizzy, confusion]}
  - {cell: pain/routine, all: [pain, passed]}
  - {cell: pain/routine, all: [pain, mild], none: [worsening, painkiller]}
  - {cell: equipment/soon, any: [iv_site]}
  - {cell: medication/soon, any: [after_drug]}
  - {cell: medication/soon, all: [medication, missed]}
  - {cell: pain/soon, any: [painkiller, pain]}
  - {cell: other_symptom/routine, any: [fever, vomit, diarrhea], all: [passed]}
  - {cell: other_symptom/soon, any: [fever, vomit, diarrhea]}
  - {cell: other_symptom/routine, any: [cough, nose, constipation]}
  - {cell: other_symptom/routine, any: [rash]}
  - {cell: fall_injury/soon, any: [blood, wound]}
  - {cell: equipment/routine, all: [device, device_question]}
  - {cell: equipment/soon, any: [device]}
  - {cell: physical_help/soon, any: [bedpan, soiled]}
  - {cell: comfort_supplies/routine, any: [bed]}
  - {cell: physical_help/routine, any: [toilet, move_body, hygiene]}
  - {cell: emotional/soon, any: [anxiety]}
  - {cell: emotional/routine, any: [sleep, company]}
  - {cell: medication/routine, any: [medication]}
  - {cell: information/routine, any: [info]}
  - {cell: information/routine, all: [food, food_question]}
  - {cell: comfort_supplies/routine, any: [water, food, temperature, environment, supplies]}
  - {cell: unclear/critical, all: [vague, urgency_words]}
  - {cell: unclear/soon, any: [vague]}
  # ---------- nothing recognized: like the old call button, someone needs a person
  - {cell: unclear/soon}
