  move_body: ["kalk", "yürü", "çevir", "döndür", "yan(a) dön", "yukarı çek", "pozisyon", "koltuğa", "kaydım", "aşağı kay", "yatırın"]
  hygiene: ["üst(ümü/ünü/ü) değiştir", "çarşaf(ı/ını/ımı) değiştir", "gecelik", "çamaşır", "kıyafet(im/i) ... (kirlen/değiş)", "yıkan", "duş (al/yap)", "duşa", "banyo", "tıraş", "diş(imi) fırçala", "silmek", "silsek"]
  water: ["su şişe", "şişe(si/m) ... boşal", "su (al/ver/iç/getir/lazım/ist/rica/bit/doldur/yok/kalma/var/getiren/isteyecek)", "bardak su", "bardağ", "suy", "sürahi", "susa", "içecek", "sulu (bir/bi)"]
  food: ["yemek", "yemeğ", "acıktım", "acıkt", "aç kaldım", "karnım aç", "kahvaltı", "çorba", "tepsi", "meyve"]
  temperature: ["üşü", "battaniye", "soğuk", "sıcak", "klima", "pencere", "örtü", "cereyan", "havasız"]
  bed: ["yatağ(ım/ı/ın) ... (dikleştir/kaldır/indir/başı/ayak)", "yatak ... (dik/kumanda)", "kumanda", "yan demir"]
  environment: ["ışık", "gürültü", "televizyon", "perde", "koku", "lamba", "ses ... (yüksek/çok)"]
  supplies: ["yastı", "kağı", "terliğ", "masa", "dolap", "sandalye", "eşya", "peçete", "mendil", "yastık", "kağıt", "şarj", "priz", "terlik", "kıyafet", "önlük", "havlu"]
