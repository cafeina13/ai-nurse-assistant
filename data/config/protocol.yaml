  missed: ["bekliyo", "gecikti", "gecikmiş", "uğramadı", "verilmedi", "verilmemiş", "vermedi", "getirmedi", "unuttunuz", "unutuldu", "yapılmadı", "atlandı", "atlanmış", "gelmedi"]
  after_drug: ["(hap/ilaç)(ı/tan) ... (çarp/dokun)", "ilacı içince", "ilaci icince", "ilaç(tan/ı) ... (sonra/beri)", "ilacı (alınca/içince)", "hap(tan/ı) ... (sonra/beri)", "iğne(den) sonra", "serum takılınca"]
  swelling: ["(dudak/dil/yüz/boğaz)(ım/ı/ü/um/u/ları/larım) ... şiş", "boğaz(ım/ı) ... (daral/kapan)"]
  rash: ["kaşın", "kızar", "döküntü", "leke", "kabar"]
  device: ["damla", "sıvı", "iğne yer", "öte duru", "ötüp", "serum", "pompa", "makine", "makina", "cihaz", "monitör", "alarm", "ötüyo", "bip", "kablo", "kanül", "damar yolu", "branül", "prob", "alet"]
  device_question: ["iptal", "alsak", "alalım", "kapat", "kıs", "sesini", "(ne/neyi) göster", "sayılar", "yolu var mı", "ne işe yar", "ne demek", "ne ölçüyo", "(çıkarabilir/çıkarsam/çekersem)", "hep mi takılı", "takılı (mı/kalacak)"]
  info: ["vizit", "hekim", "eve çık", "bilgi al", "doktor", "vizite", "sonuç", "tahlil", "röntgen", "mr", "tomografi", "biyopsi", "taburcu", "çıkış", "eve (ne zaman/gidebil/çık)", "ziyaret", "saat kaç", "kaçta", "ne zaman"]
  cough: ["öksür", "balgam"]
  nose: ["burn(um/u) ... (ak/tıka)", "nezle", "hapşır"]
  constipation: ["kabız", "tuvalete çıkamadı", "büyük tuvalet", "bağırsak(larım) çalışmı"]
  diarrhea: ["ishal", "sulu sulu"]
  hopeless: ["bittim", "tükendim", "gücüm kalmadı", "her şey bitti", "her şey bitsin", "yeter artık", "dayanacak gücüm", "kendime zarar", "kendine zarar"]
