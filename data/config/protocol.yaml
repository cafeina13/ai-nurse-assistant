# Protocol engine: extract facts from a message, then decide its grid cell with an ordered
# table, like a clinical triage protocol (Manchester Triage System style discriminators).
# Not validated with a nurse. Built from the grid, the training bank and clinical red flags,
# never from the test set; tuned on the dev split.
#
# facts: each is a list of patterns, same syntax as safety_phrases.yaml
#   word -> any word starting with it; (a/b) -> alternatives; ... -> up to four words between
# protocol: ordered lines; the FIRST line whose conditions hold decides the cell.
#   all: every fact listed must be present; any: at least one; none: none of them
# Turkish detail that matters: inability (-AmA-: "nefes alamıyorum", bad) is a different fact
# from negation or recovery ("ağrımıyor", "geçti", good). Urgency words (acil, çabuk) are a fact
# but only used for vague messages: tone must not decide urgency (tone shortcut, see the plan).

facts:
  # --- what it is about
  breath: ["nefes", "solu", "hava (alam/gelm/girm/yetm)", "havam", "hırıl", "hırılt", "ıslık"]
  breath_stopped: ["nefes(im/i) yetmi", "havasız kal", "nefes(im/i) ... (kesil/dur/git/bit/yok/tıkan)", "nefes yok", "nefessiz", "solu(ğu/k) ... kesil"]
  choke: ["boğaz(ım/ımda/ıma/ına) ... (kaç/takıl/kaldı)", "lokma", "boğul"]
  oxygen: ["oksijen", "maske", "kanül", "hortum"]
  chest: ["göğs", "göğüs", "kalb", "kalp"]
  pain: ["ağrı", "ağrıy", "ağrım", "sancı", "sızı", "sızla", "acıyo", "canım acı", "zonk", "bıçak", "yanıyo", "sıkış", "bask", "ağırlık", "batı", "vur"]
