[project]
name = "ai-nurse-assistant"
version = "0.1.0"
description = "Turkish-language assistant that triages patient calls and supports ward nurses (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "data/wardgen", "triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
